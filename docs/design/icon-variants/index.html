<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyDietHelper · варианты иконки</title>
<style>
body{margin:0;background:#17111f;color:#f1e8fc;font:16px system-ui,sans-serif;padding:clamp(20px,5vw,64px)}
h1{font-size:clamp(28px,4vw,48px);margin:0 0 12px}p{color:#bfb0ce;margin:0 0 32px}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;max-width:1440px}
figure{margin:0;padding:16px;border:1px solid #46344f;border-radius:24px;background:#241b30}
img{width:100%;aspect-ratio:1;border-radius:24%;display:block}figcaption{margin-top:14px;font-weight:600}
.small{display:flex;gap:12px;align-items:center;margin-top:14px}.small img{width:48px;height:48px}.small img:last-child{width:32px;height:32px}
a{color:inherit;text-decoration:none}
</style>
<h1>MyDietHelper</h1><p>Пять вариантов иконки · внизу каждой карточки — размер 48 и 32 пикселя. Нажмите на иконку, чтобы открыть оригинал.</p>
<main>
<figure><a href="01-plate-leaf.png"><img src="01-plate-leaf.png" alt="Тарелка с листом"></a><figcaption>1 · Тарелка с листом</figcaption><div class="small"><img src="01-plate-leaf.png" alt="48 пикселей"><img src="01-plate-leaf.png" alt="32 пикселя"></div></figure>
<figure><a href="02-apple-strength.png"><img src="02-apple-strength.png" alt="Яблоко с гантелью"></a><figcaption>2 · Яблоко и сила</figcaption><div class="small"><img src="02-apple-strength.png" alt="48 пикселей"><img src="02-apple-strength.png" alt="32 пикселя"></div></figure>
<figure><a href="03-balance-bowl.png"><img src="03-balance-bowl.png" alt="Чаша с зеленью"></a><figcaption>3 · Чаша</figcaption><div class="small"><img src="03-balance-bowl.png" alt="48 пикселей"><img src="03-balance-bowl.png" alt="32 пикселя"></div></figure>
<figure><a href="04-progress-ring.png"><img src="04-progress-ring.png" alt="Кольцо с галочкой"></a><figcaption>4 · Прогресс</figcaption><div class="small"><img src="04-progress-ring.png" alt="48 пикселей"><img src="04-progress-ring.png" alt="32 пикселя"></div></figure>
<figure><a href="05-heart-barbell.png"><img src="05-heart-barbell.png" alt="Сердце со штангой"></a><figcaption>5 · Сердце и сила</figcaption><div class="small"><img src="05-heart-barbell.png" alt="48 пикселей"><img src="05-heart-barbell.png" alt="32 пикселя"></div></figure>
</main>
</html>
